- id: android-source-not-found-signature
  profile: android/direct
  question: >-
    Our SDK log shows "Client Credentials Generation Failed" and {"error":"source not found","status":400}
    when the app starts. What does that mean?
  expect:
    contains: ["signature"]
    judge:
      - q: "Does the answer say the App Signature registered at Capillary doesn't match the signature of the app build?"
        want: "yes"
  source: android/direct.md › Known Issues; _shared/push.md › What must match

- id: flutter-push-token-but-no-push
