  category: gamification
  question: >-
    Which Game and CMS events does Experience+ send, which attribute is required on all of them, and which
    fields must we map when the events are created in Capillary?
  expect:
    contains: ["game_open", "content_viewed", "cuid", "identifierType"]
    judge:
      - q: "Does the answer say cuid is required on every event and must be mapped to customerId?"
        want: "yes"
      - q: "Does the answer list the four mapped fields: customerId, identifierType, source (SDK) and accountId (the SDK account ID)?"
        want: "yes"
      - q: "Does the answer state exactly where in Capillary the events are created as documented fact?"
        want: "no"
  source: "ios/direct.md › Modules › Gamification (Gamification events)"

- id: ios-direct-inapp-logout
  profile: ios/direct
  category: inapp
  question: >-
    A user logs out of our iOS app but still sees in-app messages meant for the previous user. What should
    the sign-out code do?
  expect:
    contains: ["userLoggedOut", "reportUserSignOut"]
    judge:
      - q: "Does the answer say to call inAppCore?.userLoggedOut() after reportUserSignOut to clear the pending in-app messages?"
        want: "yes"
  source: "ios/direct.md › Modules › In-App (Logout) and Steps › 7"

- id: ios-direct-service-account-not-in-app
