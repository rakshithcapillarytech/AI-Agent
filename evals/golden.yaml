# Golden test set: questions with known answers, checked automatically.
#
# Each case starts a fresh session with the given profile (as if the client had completed the
# setup wizard), asks one question, and checks the final answer:
#   contains      every string must appear (case-insensitive)
#   not_contains  none of these strings may appear
#   judge         yes/no questions about the answer, graded by an LLM; `want` is the right reply
#
# `profile` is shorthand "<platform>/<firebase|direct>". Every expected fact is traceable to the
# `source` in the knowledge base; keep it that way when adding cases. Real client questions from
# the integration team should be added here as they come in.

- id: flutter-gamification-base-url-key
  profile: flutter/firebase
  question: >-
    While setting up gamification we get an error that the Gamification Base URL isn't
    recognised, even though it's set in Firebase Remote Config. What's wrong?
  expect:
    contains: ["hydra_gamification_base_url"]
    judge:
      - q: "Does the answer tell the client to use `hydra_gamification_url` as the Remote Config key name?"
        want: "no"
  source: flutter/firebase.md › Modules › Gamification (key-name correction)

