- id: android-firebase-inbox-ui-images
  profile: android/firebase
  category: inbox
  question: >-
    Inbox rows show a blank image whenever the download fails. We want the stock Notification
    Center screen, and the unread rows in our brand colour. How?
  expect:
    contains: ["NotificationCenterConfig", "InboxActivity", "hydra_unread_message_background_color"]
    judge:
      - q: "Does the answer say the fallback image is set on HydraConfig.Builder during SDK initialisation?"
        want: "yes"
  source: android/firebase.md › Modules › Inbox and Known Issues

- id: android-firebase-inbox-api-click
  profile: android/firebase
  category: inbox
  question: >-
    We're building a custom inbox badge: we need the unread message count, and we need our own
    handling when a user clicks an inbox message. What APIs do we use?
  expect:
    contains: ["getUnReadMessagesCount", "registerOnMessageClickListener"]
    judge:
      - q: "Does the answer mention HydraInboxCoreApi.getInstance() and the UnReadCountListener callback onCountAvailable?"
        want: "yes"
      - q: "Does the answer say the click listener returns true when the app handles the click?"
        want: "yes"
  source: android/firebase.md › Modules › Inbox

- id: android-firebase-gamification-remote-config-keys
  profile: android/firebase
  category: correction
  question: >-
    What should we name the Firebase Remote Config parameters for gamification, especially the
    base URL one? We were going to call it hydra_gamification_url. Do we also have to apply these
    values conditionally when building HydraConfig?
  expect:
    contains: ["hydra_gamification_base_url", "hydra_gamification_key", "hydra_gamification_region"]
    judge:
      - q: "Does the answer recommend hydra_gamification_url as the Remote Config key name?"
        want: "no"
      - q: "Does the answer say the values are applied conditionally because Remote Config may not have loaded yet?"
        want: "yes"
  source: _shared/firebase-setup.md › Gamification keys (Correction) and android/firebase.md › Steps › 14

