  expect:
    contains: ["/my-app/firebase-messaging-sw.js"]
    judge:
      - q: "Does the answer say to put the file in public/ (or the static directory served at the site root) and match serviceWorkerPath to its real location?"
        want: "yes"
  source: web/firebase.md › Modules › Push (P3 table, P4) and Known Issues (Service worker 404)

- id: web-firebase-push-self-firebase-undefined
  profile: web/firebase
  category: known-issue
  question: >-
    The service worker console says self.firebase is undefined and nothing is delivered. We
    haven't touched the file except pasting it into public/. What's the cause?
  expect:
    contains: ["YOUR_", "gstatic.com"]
    judge:
      - q: "Does the answer say the YOUR_* placeholders must be replaced and importScripts may have failed because gstatic.com is not reachable (CSP)?"
        want: "yes"
  source: web/firebase.md › Known Issues (self.firebase is undefined)

- id: web-firebase-push-sw-no-notification
  profile: web/firebase
  category: edge-case
  question: >-
    A developer added `const body = await event.data.text()` logging into the push listener
    of our service worker. Since then pushes arrive but nothing is displayed. Why?
  expect:
    contains: ["firebase-messaging-sw.js"]
    judge:
      - q: "Does the answer say the push body can only be read once so Firebase's handler throws, and to not modify the worker logic?"
        want: "yes"
  source: web/firebase.md › Modules › Push (P4) and Known Issues (No notification shown at all)

- id: web-firebase-push-title-icon
  profile: web/firebase
  category: push
  question: >-
    Our test push shows up with an empty title and body, and the notification icon is missing.
    The campaign has title and body filled in. What's going on?
  expect:
    contains: ["data", "logo192.png"]
    judge:
      - q: "Does the answer say title and body must be sent as data fields, not in the notification payload?"
        want: "yes"
      - q: "Does the answer say icon and badge fall back to /logo192.png, which must exist in public/ or have its fallback paths changed?"
        want: "yes"
  source: web/firebase.md › Modules › Push (P4) and Known Issues (title/body missing; icon missing)

- id: web-firebase-push-dlr-stale-worker
