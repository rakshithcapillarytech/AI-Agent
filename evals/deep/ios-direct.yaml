# Deep evaluation cases for ios/direct (iOS, settings passed in code). See evals/golden.yaml for the format.

- id: ios-direct-spm-version-from-110
  profile: ios/direct
  category: correction
  question: >-
    I'm adding the Hydra SDK to our Package.swift. The install page shows
    `.package(url: "https://github.com/Capillary/hydra-sdk-ios-packages", .upToNextMajor(from: "1.1.0"))`.
    Can I copy that as it is? SPM seems to resolve some really old build for us.
  expect:
    contains: ["1.7.5-preprod.12", "upToNextMajor"]
    judge:
      - q: "Does the answer recommend using from: \"1.1.0\" as the version?"
        want: "no"
      - q: "Does the answer say to use 1.7.5-preprod.12 as the version?"
        want: "yes"
  source: "ios/direct.md › Steps › 2. Install the SDK › Option A (Correction) and Known Issues"

- id: ios-direct-spm-repo-and-preprod10
  profile: ios/direct
  category: correction
  question: >-
    Our Gamification iOS guide PDF says to add the package from the hydra-ios-sdk-spm repo and to use
    a minimum of 1.7.5-preprod.10. Our React Native teammates use that same repo. Which repo URL and
    which minimum version should our native iOS app use?
  expect:
    contains: ["hydra-sdk-ios-packages", "1.7.5-preprod.12"]
    judge:
      - q: "Does the answer recommend https://github.com/Capillary/hydra-ios-sdk-spm.git as the package URL for this app?"
        want: "no"
      - q: "Does the answer recommend 1.7.5-preprod.10 as the version to use?"
        want: "no"
  source: "ios/direct.md › Steps › 2. Install the SDK › Option A (Correction 2)"

- id: ios-direct-podfile-two-bugs
  profile: ios/direct
  category: correction
  question: >-
    `pod install` for our app + Notification Service Extension fails. Our Podfile is a copy of the
    install page: platform :ios, '13.0'; use_frameworks!; then `target 'MyApp' do` with the line
    `private_repo = 'https://<user>:<token>@github.com/Capillary/hydra-sdk-ios-packages.git'` as its first line,
    the pod lines, and a second target for the extension that also uses private_repo. There is also a bare line
    `Ensure you are using the correct source or git URL` above the targets. What should the Podfile look like?
  expect:
    contains: ["private_repo", "pod 'HydraPushNotificationServiceExtension', :git => private_repo"]
    judge:
      - q: "Does the answer say private_repo should be defined above (outside) both target blocks?"
        want: "yes"
      - q: "Does the answer recommend keeping private_repo defined inside the target 'YourAppTargetName' block?"
        want: "no"
      - q: "Does the answer tell the developer to remove the line 'Ensure you are using the correct source or git URL' or turn it into a comment, rather than keep it as active text?"
        want: "yes"
  source: "ios/direct.md › Steps › 2. Install the SDK › Option C: CocoaPods (two Corrections)"

