# Prerequisite rules: the client's profile → their personalised checklist (PLAN.md §4 ②).
#
# Each item applies when ANY entry in `when` matches (an item with no `when` always applies).
# Inside one entry, every key must match:
#   platforms  the client has at least one of these apps. "android" matches any mode;
#              "ios/direct" matches only that platform in that config mode.
#   modules    the client wants at least one of these modules.
#
# owner     client = the client does or provides it; capillary = Capillary provides it.
# blocking  must be done before integration starts. Only blocking CLIENT items gate the phase
#           change; Capillary values can arrive later (code uses {{placeholders}} until then).
# value     the agent may record what the client states, checked against `format`. Only for
#           identifiers that aren't secrets. Never use it for keys or tokens.
# validator the client can upload the file in the portal and the system checks it
#           (app/validators/firebase_files.py): google_services_json | google_service_info_plist.
# group     (client items) give = the client sends it to Capillary; omitted = something the client sets up
#           themselves. Used by the Prerequisites tab.
# short     one line for the Prerequisites tab (the long `how` stays for the chat checklist and the kit)
# source    where the fact comes from (file › heading). Every item must trace to the knowledge
#           base; `tests/test_prereq_engine.py` checks the files exist. Edit with SME review.
#
# {customer_id_type} in a title is replaced with the client's chosen identifier.

items:
  # ── The client gives Capillary (to register the app) ──────────────────────────────────────
  - id: android_application_id
    title: Send Capillary your Android application ID (package name)
    short: "The `applicationId` in your app's `build.gradle`."
    owner: client
    group: give
    blocking: true
    value: true
    format: android_application_id
    how: It's the `applicationId` in your app's `build.gradle`. Capillary's apps team uses it to register the app.
    when:
      - platforms: [android, react-native, flutter]
    source: _shared/prerequisites.md › The client gives Capillary

  - id: ios_bundle_id
    title: Send Capillary your iOS bundle ID
    short: "The Bundle Identifier in Xcode (target → General)."
    owner: client
    group: give
    blocking: true
    value: true
    format: ios_bundle_id
    how: It's the Bundle Identifier in Xcode (target → General). Capillary's apps team uses it to register the app.
    when:
      - platforms: [ios, react-native, flutter]
    source: _shared/prerequisites.md › The client gives Capillary

  - id: android_sha256
    title: Send Capillary your Android app signature (SHA256)
    short: "From your Android signing report, for the build you'll run. A mismatch stops the SDK from starting."
    owner: client
    group: give
    blocking: true
    value: true
    format: sha256_fingerprint
    how: >-
      Copy the SHA256 fingerprint from your Android app signing report, for the build you'll run.
      Capillary registers it as the App Signature; if it doesn't match the app, the SDK can't start
      (`Client Credentials Generation Failed … source not found`). Capillary's source-account page says it is required only for Android apps.
    when:
      - platforms: [android, react-native, flutter]
    source: _shared/prerequisites.md › The client gives Capillary

  - id: push_firebase_project
    title: Create a Firebase service account for Capillary and share its key (push)
    short: "A dedicated service account with a documented role; share its JSON key only by a one-time vault link or a restricted file link."
    owner: client
    group: give
    blocking: false
    how: >-
      Capillary needs a dedicated service account in your Firebase project (the project must be the same one your app
      uses). Turn on the Firebase Cloud Messaging API (V1), create the account, give it the role
      `roles/firebasecloudmessaging.admin` (or a custom role with only `cloudmessaging.messages.create`) and generate a JSON key.
      Only Capillary's backend needs the key; never put it in an app. The key contains a private key: share it only by a one-time link from a password manager or secrets vault, or a
      restricted link from an enterprise file-sharing platform; never in chat, email or git.
    when:
      - platforms: [android/firebase, ios, react-native, flutter]
        modules: [push]
    source: _shared/firebase-setup.md › 7. Service account for Capillary (push on Android and iOS)

  # ── SDK package access ────────────────────────────────────────────
  - id: android_repo_access
    title: Get access to the Android SDK repository
    short: "Ask Capillary for read access to the repo, then create a GitHub token with `read:packages`. Keep it on your machine."
    owner: client
    blocking: true
    how: >-
      Ask Capillary's access team for read access to https://github.com/Capillary/hydra-sdk-android-maven,
      then create a GitHub Personal Access Token with the `read:packages` scope. Keep the token on your
      machine (e.g. a git-ignored `github.properties`); never share it in chat.
    when:
      - platforms: [android]
    source: _shared/prerequisites.md › SDK package access

  - id: rn_package_access
    title: Check whether you need credentials for Capillary's React Native packages
    short: "The public docs list no credentials (iOS isn't stated). If an install is denied, ask your Capillary contact for a GitHub token."
    owner: client
    blocking: false
    how: >-
      Capillary's public developer docs install `@capillarytech/react-native-hydra-lib` from the public npm registry and
      the Android SDK from Maven Central, with no credentials. An older internal setup used GitHub Packages and a GitHub
      token; whether React Native on iOS still needs one isn't stated. If an install is denied, ask your Capillary
      contact for a GitHub username and token, keep them in environment variables (never in the repo or chat), and ask
      for a new one when it expires.
    when:
      - platforms: [react-native]
    source: _shared/prerequisites.md › SDK package access

  - id: ssl_key_updatable
    title: Plan to update the SSL public key without an app release
    short: "The key expires about every 9 months. Keep it in remote config so you can swap it without a release."
    owner: client
    blocking: false
    how: >-
      The SSL public key expires about every 9 months; when it does the SDK fails with a certificate pinning failure.
      Keep the key (with the Account Id and Base URL) in Firebase Remote Config or another remote configuration rather
      than hardcoding it, so it can be replaced without a new store release.
    when:
      - platforms: [android, ios, react-native, flutter]
    source: "_shared/prerequisites.md › SSL public key: it expires"

  # ── Firebase (Firebase mode only) ─────────────────────────────────────────────────────────
  - id: firebase_project
    title: Create a Firebase project and register your app(s)
    short: "Firebase Console → Add project, then register each app."
    owner: client
    blocking: true
    how: Firebase Console → Add project, then register each app. Skip the project step if you already have one.
    when:
      - platforms: [android/firebase, ios/firebase, react-native/firebase, flutter, web/firebase]  # Flutter: Firebase is base setup in every mode
      - platforms: [web/direct]  # direct mode still uses Firebase for push
        modules: [push]
      - platforms: [react-native/direct, ios/direct]  # push needs a Firebase project in any config mode
        modules: [push]
    source: _shared/firebase-setup.md › 1. Create a Firebase project

  - id: google_services_json
    title: Download google-services.json for your Android app
    short: "Download it when you register the Android app in Firebase. Skip the code changes Firebase suggests."
    owner: client
    blocking: true
    validator: google_services_json
    how: Download it while registering the Android app in Firebase. Don't make the code changes Firebase suggests. Then upload it with the button in the checklist panel and we'll check it belongs to your app.
    when:
      - platforms: [android/firebase, react-native/firebase, flutter]
      - platforms: [react-native/direct]  # Android push
        modules: [push]
    source: _shared/firebase-setup.md › 2. Register each app

  - id: google_service_info_plist
    title: Download GoogleService-Info.plist for your iOS app
    short: "Download it when you register the iOS app in Firebase. Skip the code changes Firebase suggests."
    owner: client
    blocking: true
    validator: google_service_info_plist
    how: Download it while registering the iOS app in Firebase. Don't make the code changes Firebase suggests. Then upload it with the button in the checklist panel and we'll check it belongs to your app.
    when:
      - platforms: [ios/firebase, react-native/firebase, flutter]
      - platforms: [react-native/direct, ios/direct]  # iOS push
        modules: [push]
    source: _shared/firebase-setup.md › 2. Register each app

  - id: web_firebase_config
    title: Register your web app in Firebase and copy its config object
    short: "Firebase dashboard → Web icon → Register app, then copy the config object."
    owner: client
    blocking: true
    how: Project dashboard → Web icon (`</>`) → enter a nickname → Register app, then copy the Firebase configuration object.
    when:
      - platforms: [web/firebase]
      - platforms: [web/direct]
        modules: [push]
    source: _shared/firebase-setup.md › 2. Register each app

  - id: remote_config_values
    title: Add Capillary's values to Firebase Remote Config and publish
    short: "Add Capillary's values as Remote Config parameters, with the exact names from your platform guide, then publish."
    owner: client
    blocking: false
    how: >-
      Once Capillary sends the values, add them as Remote Config parameters with the exact names in your
      platform guide, then click Publish changes.
    when:
      - platforms: [android/firebase, ios/firebase, react-native/firebase, flutter/firebase, web/firebase]
    source: _shared/firebase-setup.md › 3. Remote Config

  # ── CRM ───────────────────────────────────────────────────────────────────────────────────
  - id: crm_account_linking
    title: "Set the CRM Account Linking Identifier to {customer_id_type}"
    short: "Set in Capillary CRM (MAPP_SDK channel settings). Must match the customerId your app sends at sign-in."
    owner: client
    blocking: false
    how: >-
      The customerId your app sends at sign-in must match it. Capillary CRM → Organisation Settings →
      Omni Channel Settings → Channel Configurations → MAPP_SDK → Account Linking Identifier.
    when:
      - platforms: [android, ios, react-native, flutter]
    source: "_shared/prerequisites.md › Capillary CRM: Account Linking Identifier"

  # ── Web push ──────────────────────────────────────────────────────────────────────────────
  - id: web_vapid_key
    title: Generate a VAPID key for web push
    short: "Firebase project settings → Cloud Messaging → Web configuration → Web Push certificates → Generate key pair."
    owner: client
    blocking: false
    how: Firebase project settings → Cloud Messaging → Web configuration → Web Push certificates → Generate key pair.
    when:
      - platforms: [web]
        modules: [push]
    source: "_shared/firebase-setup.md › 4. Web push: VAPID key"

  # ── Loyalty View ──────────────────────────────────────────────────────────────────────────
  - id: cap_token
    title: Plan how your app gets the Capillary B2B short-lived token (Loyalty View only)
    short: "Passed with `setCapToken` after login. How to get it isn't documented; ask your Capillary contact."
    owner: client
    blocking: false
    how: >-
      The app passes it with setCapToken after the user logs in, before the Loyalty View is shown.
      How to obtain the token isn't documented yet; confirm it with your Capillary contact.
    when:
      - modules: [gamification]
    source: "_shared/prerequisites.md › Loyalty View: Capillary token"

  # ── Capillary gives the client ────────────────────────────────────────────────────────────
  - id: account_id
    title: Account Id
    short: "The Source Account Id of your MAPP_SDK channel account."
    owner: capillary
    blocking: true
    how: Capillary sends it once your app is registered.
    source: _shared/prerequisites.md › Capillary gives the client

  - id: base_url
    title: Base URL
    short: "Specific to your Capillary cluster; use the one for UAT or production."
    owner: capillary
    blocking: true
    how: Capillary sends it once your app is registered.
    source: _shared/prerequisites.md › Capillary gives the client

  - id: ssl_public_key
    title: SSL Public Key
    short: "Mobile only. Expires about every 9 months."
    owner: capillary
    blocking: true
    how: Capillary sends it once your app is registered (mobile apps only).
    when:
      - platforms: [android, ios, react-native, flutter]
    source: _shared/prerequisites.md › Capillary gives the client

  - id: org_id
    title: Org Id
    short: "Web, and Android, iOS and React Native in direct mode. In other setups mainly for guest users; your platform guide says."
    owner: capillary
    blocking: true
    how: Capillary sends it once your app is registered.
    when:
      - platforms: [web, android, ios]  # iOS gamification passes orgID in both modes (to be confirmed)
      - platforms: [flutter, react-native]  # the docs: only for the Anonymous/Visitor flow
        modules: [visitor]
    source: _shared/prerequisites.md › Capillary gives the client

  - id: gamification_key
    title: Gamification Key (write key)
    short: "Needed for gamification."
    owner: capillary
    blocking: true
    how: Capillary sends it for gamification.
    when:
      - modules: [gamification]
    source: _shared/prerequisites.md › Capillary gives the client

  - id: gamification_region
    title: Gamification Region
    short: "IN, US or ME. Capillary confirms which."
    owner: capillary
    blocking: true
    how: One of IN, US or ME (web examples use lower case). Capillary confirms which.
    when:
      - modules: [gamification]
    source: _shared/prerequisites.md › Capillary gives the client

  - id: gamification_base_url
    title: Gamification Base URL
    short: "Required with the key and region on Flutter, React Native and Web."
    owner: capillary
    blocking: true
    how: Required together with the Gamification Key and Region on Flutter, React Native and Web (to be confirmed with a Capillary engineer; `_shared/prerequisites.md` Gap).
    when:
      - platforms: [flutter, react-native, web]
        modules: [gamification]
    source: _shared/prerequisites.md › Capillary gives the client

  - id: gamification_base_url_native
    title: Gamification Base URL (optional)
    short: "Optional on Android. On iOS, either this or the region is enough."
    owner: capillary
    blocking: false
    how: Optional on Android; on iOS either the Gamification Region or the Base URL is enough. Your platform guide says which to use.
    when:
      - platforms: [android, ios]
        modules: [gamification]
    source: _shared/prerequisites.md › Capillary gives the client

  - id: gamification_view_ids
    title: Banner / Embedded / Loyalty view IDs (only for the views you use)
    short: "Only for the views you use. Banner and Embedded IDs are in the gamification dashboard; the Loyalty ID comes from Capillary."
    owner: capillary
    blocking: false
    how: Banner and Embedded IDs come from the gamification dashboard's entry-point settings; the Loyalty ID from the Capillary team.
    when:
      - modules: [gamification]
    source: _shared/prerequisites.md › Capillary gives the client
