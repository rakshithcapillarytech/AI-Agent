- id: rn-direct-package-migration-ios-pat
  profile: react-native/direct
  category: gap
  question: >-
    We're picking up an older React Native app. Its .npmrc still has an @capillary scope pointing at
    npm.pkg.github.com with a token, and android/app/build.gradle applies a hydra_github_setup.gradle
    file. What do we change to install the SDK properly now? And does the iOS side still need a GitHub
    username and Personal Access Token for pod install?
  expect:
    contains: ["@capillarytech/react-native-hydra-lib", "hydra_github_setup.gradle"]
    judge:
      - q: "Does the answer recommend installing `@capillary/react-native-hydra-lib` from GitHub Packages (npm.pkg.github.com)?"
        want: "no"
      - q: "Does the answer say it is not stated or confirmed whether iOS still needs GitHub credentials, or suggest asking a Capillary engineer?"
        want: "yes"
  source: react-native/direct.md › Steps › 1 and 2

