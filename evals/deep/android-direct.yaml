- id: android-direct-client-credentials-dev-flavor
  profile: android/direct
  category: edge-case
  question: >-
    Our debug build uses applicationId com.acme.shop.dev and the SDK log shows
    `Client Credentials Generation Failed` with `{"error":"source not found","status":400}`.
    The release build is fine. What do we check?
  expect:
    contains: ["App Signature", "Bundle Name"]
    judge:
      - q: "Does the answer say a build variant with a different application ID is treated as a different app by Capillary and must be registered?"
        want: "yes"
      - q: "Does the answer say to compare the build's SHA256 signature with the one registered at Capillary?"
        want: "yes"
  source: android/direct.md › Known Issues and _shared/troubleshooting.md › 2

