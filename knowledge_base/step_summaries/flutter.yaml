    do: "Register the app in Firebase, download `google-services.json` and `GoogleService-Info.plist`, and add Remote Config `hydra_account_id`, `hydra_base_url`, `hydra_ssl_public_key`, `hydra_remote_log_level` (0 to 5) with Capillary's values. Add `hydra_org_id` only for the visitor flow."
    evidence: ["hydra_account_id", "hydra_remote_log_level", "with these exact names"]
  "2":
    do: "Run `flutter pub add capillary_hydra capillary_hydra_platform_interface` to add the latest release of both packages, and keep the two on the same version."
    evidence: ["flutter pub add capillary_hydra capillary_hydra_platform_interface", "Keep both packages on the same version"]
  "3":
