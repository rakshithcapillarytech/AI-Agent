- id: android-direct-ssl-key-expired-trap
  profile: android/direct
  category: trap
  question: >-
    The app has worked since spring and now every SDK call fails with `Certificate pinning failure`
    in Logcat. A Flutter colleague says to set enable_ssl_pinning to false. We hard-coded the key
    in `.sslPublicKey(...)`. What should we do?
  expect:
    contains: ["9 months"]
    judge:
      - q: "Does the answer recommend turning SSL pinning off (enable_ssl_pinning false) as the fix for this Android app?"
        want: "no"
      - q: "Does the answer say to get the current SSL public key from Capillary and update it?"
        want: "yes"
      - q: "Does the answer note that a key compiled into the app needs a new release when it expires?"
        want: "yes"
  source: "_shared/prerequisites.md › SSL public key (it expires)"

