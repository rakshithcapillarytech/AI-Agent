# Key facts that would break an integration if they changed, checked against Capillary's online docs.
#
# `python -m app.sync check` (and the sync run) test two things for each:
#   - the exact `text` is still on the online page `page`  -> if not, Capillary changed it: the guides may now be wrong;
#   - the guides in `used_in` still carry the fact         -> if not, a guide drifted from the page.
# `guide_text` is what the guides contain when it differs from the page's wording (for example a version in front matter).
# Add an anchor whenever a fact is important enough that a silent change online would hurt a client.

anchors:
  # ── Android ──────────────────────────────────────────────────────────────────────────────
  - id: android-sdk-version
    fact: Android SDK version 1.10.6 (every module)
    page: android-sdk-getting-started
    text: "1.10.6"
    guide_text: "sdk_version: 1.10.6"
    used_in: [android/direct.md, android/firebase.md]
  - id: android-maven-group
    fact: Android artifacts use the Maven group com.capillarytech
    page: installing-sdk
    text: "com.capillarytech:hydra-core:1.10.6"
    guide_text: "com.capillarytech:hydra-core"
    used_in: [android/direct.md, android/firebase.md]
  - id: android-catalog
    fact: The version catalog is com.capillarytech:hydra-catalog
    page: installing-sdk
    text: "com.capillarytech:hydra-catalog:1.10.6"
    guide_text: "com.capillarytech:hydra-catalog"
    used_in: [android/firebase.md]
  - id: android-maven-repo
    fact: The Android SDK comes from the GitHub Packages repository hydra-sdk-android-maven
    page: installing-sdk
    text: "https://maven.pkg.github.com/Capillary/hydra-sdk-android-maven"
    used_in: [android/direct.md, android/firebase.md]
  - id: android-min-sdk
    fact: Android minimum SDK is 21
    page: android-sdk-getting-started
    text: "Android SDK version V21 or above"
    guide_text: "minSdk 21"
    used_in: [android/direct.md, android/firebase.md]
  - id: android-gamification-min
    fact: Gamification on Android needs SDK 1.10.6 or later
    page: gamification-android
    text: "Minimum SDK version: `1.10.6`"
    guide_text: "1.10.6"
    used_in: [android/direct.md, android/firebase.md]
  - id: android-messaging-service
    fact: The manifest service is com.capillarytech.hydra.firebase.HydraFirebaseMessagingService
    page: push-notification
    text: "com.capillarytech.hydra.firebase.HydraFirebaseMessagingService"
    used_in: [android/firebase.md]
  - id: android-xiaomi-kit
    fact: The Xiaomi push kit is com.capillarytech:hydra-mi-push-kit
    page: xiaomi-push-notification
    text: "com.capillarytech:hydra-mi-push-kit:1.10.6"
    guide_text: "hydra-mi-push-kit"
    used_in: [android/firebase.md]
  - id: android-signature-required
    fact: The app signature is required for Android apps (source account)
    page: set-up-source-account
    text: "required only for Android apps"
    used_in: [_shared/push.md]

  # ── Firebase service account for Capillary ───────────────────────────────────────────────
  - id: firebase-role
    fact: The service account role is Firebase Cloud Messaging API Admin
    page: configure-firebase
    text: "roles/firebasecloudmessaging.admin"
    used_in: [_shared/firebase-setup.md, prerequisites.yaml, android/firebase.md]
  - id: firebase-custom-role
    fact: A custom role needs only cloudmessaging.messages.create
    page: configure-firebase
    text: "cloudmessaging.messages.create"
    used_in: [_shared/firebase-setup.md]
  - id: firebase-fcm-v1
    fact: The Firebase Cloud Messaging API (V1) must be enabled
    page: configure-firebase
    text: "Firebase Cloud Messaging API (V1)"
    used_in: [_shared/firebase-setup.md, android/firebase.md]
  - id: firebase-dedicated-account
    fact: Create a dedicated service account for Capillary
    page: configure-firebase
    text: "Create a dedicated service account for Capillary"
    guide_text: "dedicated"
    used_in: [_shared/firebase-setup.md, android/firebase.md]
  - id: firebase-key-sharing
    fact: The key is shared by a one-time link that expires within 24 to 48 hours
    page: configure-firebase
    text: "24 to 48 hours"
    used_in: [_shared/firebase-setup.md, _shared/push.md]

