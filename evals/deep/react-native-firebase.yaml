    token, and whose android/app/build.gradle applies hydra_github_setup.gradle. What do we change to install
    the SDK the current way? And does pod install on iOS still need a GitHub username and Personal Access
    Token?
  expect:
    contains: ["@capillarytech/react-native-hydra-lib", "hydra_github_setup.gradle"]
    judge:
      - q: "Does the answer recommend installing `@capillary/react-native-hydra-lib` from GitHub Packages (npm.pkg.github.com)?"
        want: "no"
      - q: "Does the answer say it is not stated or confirmed whether iOS still needs GitHub credentials, or suggest asking a Capillary engineer?"
        want: "yes"
