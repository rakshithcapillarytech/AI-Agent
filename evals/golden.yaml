  expect:
    contains: ["Firebase project"]
    judge:
      - q: "Does the answer tell the client to check that the app's Firebase project is the one registered with Capillary?"
        want: "yes"
      - q: "Does the answer suggest sending a test message from the Firebase console to tell whether the problem is the app or Capillary's setup?"
        want: "yes"
  source: _shared/push.md › Common problems; Test the push flow

