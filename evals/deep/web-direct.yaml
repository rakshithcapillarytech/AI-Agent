# Deep evaluation cases for web/direct (settings passed in code via HydraSDK.initialize()).
# Format: see evals/golden.yaml. Every `contains` string is verified against the kit by
# `uv run python -m evals.audit_kb` (check "evals answerable from their kit").

- id: web-direct-install-yarn-beta
  profile: web/direct
  category: setup
  question: >-
    We're a yarn project (there's a yarn.lock in the repo root) and we want to try the
    pre-release SDK on our staging site first. What exactly do we run?
  expect:
    contains: ["yarn add cap-hydra-web-sdk@beta"]
    judge:
      - q: "Does the answer give a yarn command (not npm install) for the beta channel?"
        want: "yes"
  source: web/direct.md › Steps › 1. Install the SDK

- id: web-direct-install-bun-types
  profile: web/direct
  category: setup
  question: >-
    Project uses bun (bun.lockb in the root). I added the SDK as a devDependency and now CI
    fails on `import { HydraSDK } from "cap-hydra-web-sdk"` with TypeScript saying it can't
    resolve the module's types. What's the correct install and what's wrong?
  expect:
    contains: ["bun add cap-hydra-web-sdk", "dependencies"]
    judge:
      - q: "Does the answer say the package belongs in `dependencies` (not devDependencies)?"
        want: "yes"
  source: web/direct.md › Steps › 1 and Known Issues (TypeScript import errors)

- id: web-direct-service-wrapper
  profile: web/direct
  category: setup
  question: >-
    How should we structure our code around the SDK? We were going to import HydraSDK
    straight into our React components wherever we need to track something.
  expect:
    contains: ["sdkService"]
    judge:
      - q: "Does the answer say components should NOT import HydraSDK directly and that every call should go through one service wrapper file?"
        want: "yes"
      - q: "Does the answer say to import the service file from the app entry point?"
        want: "yes"
  source: web/direct.md › Steps › 2 (Rules to enforce)

- id: web-direct-init-lifecycle-await
  profile: web/direct
  category: edge-case
  question: >-
    Our React setup code looks like this and the SDK sometimes isn't ready when the first
    page view fires:

        useEffect(() => {
          (async () => {
            await HydraSDK.initialize({ accountId, baseURL, orgId });
            if (HydraSDK.isInitialized()) HydraSDK.pageView();
          })();
        }, []);

    What should we change?
  expect:
    contains: ["sdkService.initialize()"]
    judge:
      - q: "Does the answer say to call initialize once at module load / top level of the service file, not inside useEffect or another lifecycle hook?"
        want: "yes"
      - q: "Does the answer tell the developer to keep awaiting SDK calls or to add isInitialized() guards?"
        want: "no"
      - q: "Does the answer say the SDK queues calls internally until it is ready?"
        want: "yes"
  source: web/direct.md › Steps › 2 (Rules to enforce) and Known Issues

- id: web-direct-init-missing-field
  profile: web/direct
  category: known-issue
  question: >-
    HydraSDK.initialize() throws a synchronous Error as soon as the page loads. Our config
    object only has accountId, baseURL and appVersion. What's the problem?
  expect:
    contains: ["orgId"]
    judge:
      - q: "Does the answer say accountId, baseURL and orgId are all required in direct mode and the missing field must be added to the initialize() call?"
        want: "yes"
  source: web/direct.md › Known Issues (initialize() throws) and API Reference

- id: web-direct-trap-remote-config-keys
  profile: web/direct
  category: trap
  question: >-
    I copied initialize() from another project of ours. It has accountId, baseURL and orgId,
    but also a firebaseConfig object and remoteConfigKey: "hydra_sdk_config". Our direct values
    seem to be ignored (the SDK is trying to read Firebase Remote Config). Why, and what do we do?
  expect:
    contains: ["remoteConfigKey"]
    judge:
      - q: "Does the answer tell the developer to remove remoteConfigKey and firebaseConfig from initialize() in this setup?"
        want: "yes"
      - q: "Does the answer say the SDK picks Remote Config mode because remoteConfigKey is present?"
        want: "yes"
      - q: "Does the answer tell the developer to create a Remote Config parameter for the Hydra settings?"
        want: "no"
  source: web/direct.md › Known Issues (Direct config ignored) and top bootstrap paragraph

- id: web-direct-events-not-arriving
  profile: web/direct
  category: known-issue
  question: >-
    Everything initialises without errors, but none of our events or page views show up in
    Capillary. What should we verify first?
  expect:
    contains: ["baseURL"]
    judge:
      - q: "Does the answer say to verify the baseURL value with Capillary?"
        want: "yes"
  source: web/direct.md › Known Issues (Events not reaching the API)

- id: web-direct-consent-banner
  profile: web/direct
  category: events
  question: >-
    A user rejects cookies in our consent banner. What do we call on the SDK, what happens to
    events fired afterwards, and how should we restore their choice on the next visit?
  expect:
    contains: ["disableTracking", "enableTracking"]
    judge:
      - q: "Does the answer say new events are dropped while tracking is disabled, and that events already queued are kept and sent when tracking is re-enabled?"
        want: "yes"
      - q: "Does the answer say the app must persist the consent decision in its own storage and call enableTracking() / disableTracking() on app load?"
        want: "yes"
  source: web/direct.md › Steps › 8 and Known Issues (Events missing after consent revoked)

- id: web-direct-identify-login-refresh
  profile: web/direct
  category: identity
  question: >-
    On login for an existing customer we call
    sdkService.identifyUser("email", user.email, "USER_UPDATE") and the profile isn't being
    created in Capillary. We also run it in our layout component on every page load to keep
    the SDK in sync. What's wrong?
  expect:
    contains: ["USER_REGISTER", "IndexedDB"]
    judge:
      - q: "Does the answer say USER_REGISTER is used for both login and sign-up and USER_UPDATE is only for profile changes, never at login?"
        want: "yes"
      - q: "Does the answer say not to re-identify the user on every page refresh because the SDK persists user context?"
        want: "yes"
  source: web/direct.md › Steps › 3, 4 and Known Issues (Wrong actionType; Re-identifying on every refresh)

- id: web-direct-trap-mobile-identify
  profile: web/direct
  category: trap
  question: >-
    On our Android app we call pushUserSignin after login, and on iOS something like
    Hydra.identify via HydraCore. What's the equivalent call to run when a user signs in on
    the website?
  expect:
    contains: ["HydraSDK.identify"]
    judge:
      - q: "Does the answer explain the web sign-in call as sdkService.identifyUser (wrapping HydraSDK.identify) with identifier type, cuid and actionType USER_REGISTER?"
        want: "yes"
      - q: "Does the answer tell the web developer to call pushUserSignin, HydraCore or a mobile Hydra.identify API?"
        want: "no"
  source: web/direct.md › Steps › 3 and API Reference

