# Deep evaluation cases for ios/firebase (iOS, settings in Firebase Remote Config). See evals/golden.yaml for the format.

- id: ios-firebase-spm-version-from-110
  profile: ios/firebase
  category: correction
  question: >-
    Package.swift from the install page has `.upToNextMajor(from: "1.1.0")` for the hydra-sdk-ios-packages
    dependency. We resolved it and got an old SDK without gamification. What version should be there?
  expect:
    contains: ["1.7.5-preprod.12", "upToNextMajor"]
    judge:
      - q: "Does the answer recommend using from: \"1.1.0\" as the version?"
        want: "no"
      - q: "Does the answer say to use 1.7.5-preprod.12 (the required/minimum version)?"
        want: "yes"
  source: "ios/firebase.md › Steps › 2. Install the SDK › Option A (Correction) and Known Issues"

- id: ios-firebase-spm-repo-and-preprod10
  profile: ios/firebase
  category: correction
  question: >-
    The Experience+ iOS gamification guide says to use https://github.com/Capillary/hydra-ios-sdk-spm.git with
    minimum 1.7.5-preprod.10. Is that the package we add to our native iOS project?
  expect:
    contains: ["hydra-sdk-ios-packages", "1.7.5-preprod.12"]
    judge:
      - q: "Does the answer recommend https://github.com/Capillary/hydra-ios-sdk-spm.git as the package URL for this app?"
        want: "no"
      - q: "Does the answer recommend 1.7.5-preprod.10 as the version to use?"
        want: "no"
  source: "ios/firebase.md › Steps › 2. Install the SDK › Option A (Correction 2)"

- id: ios-firebase-podfile-two-bugs
  profile: ios/firebase
  category: correction
  question: >-
    Our Podfile (copied from the install guide) has `private_repo = ...` as the first line inside
    `target 'MyApp' do`, and there's an extension target below it that references private_repo too. We also
    have a stray line "Ensure you are using the correct source or git URL" that isn't commented. `pod install`
    breaks. What's the fixed layout?
  expect:
    contains: ["private_repo", "pod 'HydraPushNotificationServiceExtension', :git => private_repo"]
    judge:
      - q: "Does the answer say private_repo should be defined above (outside) both target blocks?"
        want: "yes"
      - q: "Does the answer recommend keeping private_repo defined inside the target 'YourAppTargetName' block?"
        want: "no"
      - q: "Does the answer tell the developer to remove that line or make it a comment, rather than keep it as active text?"
        want: "yes"
  source: "ios/firebase.md › Steps › 2. Install the SDK › Option C: CocoaPods (two Corrections)"

