# Deep evaluation cases for ios/firebase (iOS, settings in Firebase Remote Config). See evals/golden.yaml for the format.

- id: ios-firebase-spm-snippet-syntax
  profile: ios/firebase
  category: correction
  question: >-
    I copied the Package.swift snippet from the install page:
    `.package(url:"https://github.com/Capillary/hydra-ios-sdk-spm",upToNextMajor(from: "1.10.6"))` with
    `name: “<Project-name>”` and Xcode refuses to build the manifest. What should it look like?
  expect:
    contains: ["hydra-ios-sdk-spm", ".upToNextMajor"]
    judge:
      - q: "Does the answer say upToNextMajor needs a leading dot (.upToNextMajor) and that the name should use plain straight quotes?"
        want: "yes"
      - q: "Does the answer use https://github.com/Capillary/hydra-ios-sdk-spm as the package URL?"
        want: "yes"
  source: "ios/firebase.md › Steps › 2. Install the SDK › Option A (Correction)"
- id: ios-firebase-public-repo-no-token
  profile: ios/firebase
  category: correction
  question: >-
    An older Capillary runbook says to add the package from the private repo hydra-sdk-ios-packages with a GitHub
    token and use version 1.7.5-preprod.12. Our colleague says the repo is public now. Which repo URL and which
    minimum SDK version should our native iOS app use, and do we need a token?
  expect:
    contains: ["hydra-ios-sdk-spm", "1.10.6"]
    judge:
      - q: "Does the answer recommend https://github.com/Capillary/hydra-ios-sdk-spm as the package URL for this app?"
        want: "yes"
      - q: "Does the answer say no GitHub account or personal access token is needed for the SDK repository?"
        want: "yes"
      - q: "Does the answer recommend the private hydra-sdk-ios-packages repo or the 1.7.5-preprod versions as what to use?"
        want: "no"
  source: "ios/firebase.md › Steps › 1 (Correction) and 2"
- id: ios-firebase-podfile-two-bugs
  profile: ios/firebase
  category: correction
  question: >-
    `pod install` for our app + Notification Service Extension fails. Our Podfile is a copy of the
    install page: platform :ios, '15.6'; use_frameworks!; then `target 'MyApp' do` with the line
    `hydra_repo = 'https://github.com/Capillary/hydra-ios-sdk-spm.git'` as its first line,
    the pod lines, and a second target for the extension that also uses hydra_repo. There is also a bare line
    `Ensure you are using the correct source or git URL` above the pods. What should the Podfile look like?
  expect:
    contains: ["hydra_repo", "pod 'HydraPushNotificationServiceExtension', :git => hydra_repo"]
    judge:
      - q: "Does the answer say hydra_repo should be defined above (outside) both target blocks?"
        want: "yes"
      - q: "Does the answer recommend keeping hydra_repo defined inside the target 'YourAppTargetName' block?"
        want: "no"
      - q: "Does the answer tell the developer to remove the line 'Ensure you are using the correct source or git URL' or turn it into a comment, rather than keep it as active text?"
        want: "yes"
  source: "ios/firebase.md › Steps › 2. Install the SDK › Option C: CocoaPods (two Corrections)"
- id: ios-firebase-gamification-base-url-key-name
  profile: ios/firebase
  category: correction
