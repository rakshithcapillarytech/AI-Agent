# Deep evaluation cases for web/firebase (Remote Config bootstrap: settings come from a JSON
# parameter in Firebase Remote Config). Format: see evals/golden.yaml. Every `contains` string is
# verified against the kit by `uv run python -m evals.audit_kb` ("evals answerable from their kit").

- id: web-firebase-console-project-webapp
  profile: web/firebase
  category: setup
  question: >-
    We don't have a Firebase project for the website yet. Walk me through creating the project
    and registering the web app so I get the config object the SDK needs.
  expect:
    contains: ["Add project", "Register app"]
    judge:
      - q: "Does the answer mention clicking the Web icon (</>), entering an app nickname, and copying the Firebase config object after registering?"
        want: "yes"
      - q: "Does the answer say enabling Google Analytics is optional (recommended)?"
        want: "yes"
  source: web/firebase.md › Steps › 1 and 2 (also _shared/firebase-setup.md › 1, 2)

- id: web-firebase-remote-config-json
  profile: web/firebase
  category: setup
  question: >-
    How do we store the Hydra settings in Remote Config? Which fields go in, what do we name
    the parameter, and anything we must do after saving?
  expect:
    contains: ["Publish changes", "remoteConfigKey", "accountId"]
    judge:
      - q: "Does the answer say the parameter key is a name of your choice and is the value later passed as remoteConfigKey in initialize()?"
        want: "yes"
      - q: "Does the answer say the default value is a JSON containing accountId, baseURL and orgId (required), and the three gamification fields only if gamification is used?"
        want: "yes"
      - q: "Does the answer say to republish after every edit?"
        want: "yes"
  source: web/firebase.md › Steps › 3 (also _shared/firebase-setup.md › 3)

- id: web-firebase-install-pnpm-types
  profile: web/firebase
  category: setup
  question: >-
    Our repo has pnpm-lock.yaml. What do we run to install the production SDK? Also, TypeScript
    can't find the package's types in our build after we put it under devDependencies. Why?
  expect:
    contains: ["pnpm add cap-hydra-web-sdk", "dependencies"]
    judge:
      - q: "Does the answer say the package must be in `dependencies` and node_modules should be refreshed?"
        want: "yes"
  source: web/firebase.md › Steps › 5 and Known Issues (TypeScript import errors)

- id: web-firebase-init-call
  profile: web/firebase
  category: init
  question: >-
    Show me the HydraSDK.initialize() call for our web app. Where do the Capillary values like
    accountId and the base URL go?
  expect:
    contains: ["firebaseConfig", "remoteConfigKey"]
    judge:
      - q: "Does the answer pass firebaseConfig and remoteConfigKey to initialize() and keep accountId, baseURL and orgId OUT of the initialize() call (they live in Remote Config)?"
        want: "yes"
  source: web/firebase.md › Steps › 6

- id: web-firebase-trap-values-in-initialize
  profile: web/firebase
  category: trap
  question: >-
    For a quick local test I'd like to pass accountId, baseURL and orgId straight into
    initialize() next to remoteConfigKey so I don't have to touch Remote Config. Is that fine?
  expect:
    contains: ["Remote Config"]
    judge:
      - q: "Does the answer tell the developer to put accountId, baseURL and orgId in initialize() in this mode?"
        want: "no"
      - q: "Does the answer say these Capillary and gamification fields come only from Remote Config and must not be passed to initialize()?"
        want: "yes"
  source: web/firebase.md › Steps › 3 and Steps › 6 (Rules to enforce)

- id: web-firebase-silent-failure-orgid
  profile: web/firebase
  category: known-issue
  question: >-
    The app loads with no visible errors but the SDK does nothing: no events, no profile. Our
    Remote Config JSON has accountId and baseURL, plus gamification keys. What could be wrong?
  expect:
    contains: ["orgId"]
    judge:
      - q: "Does the answer say a missing accountId, baseURL or orgId makes initialize() fail silently in this mode (only a fetch error is logged)?"
        want: "yes"
      - q: "Does the answer say to add the field to the JSON and republish?"
        want: "yes"
  source: web/firebase.md › Steps › 3 and Known Issues (SDK silently does nothing)

- id: web-firebase-events-not-arriving
  profile: web/firebase
  category: known-issue
  question: >-
    Initialisation looks fine but events never reach Capillary. We just edited the base URL in
    the Remote Config console. What do we check?
  expect:
    contains: ["baseURL"]
    judge:
      - q: "Does the answer say to verify baseURL and to confirm the Remote Config parameter has been published?"
        want: "yes"
  source: web/firebase.md › Known Issues (Events not reaching the API)

- id: web-firebase-init-lifecycle-await
  profile: web/firebase
  category: edge-case
  question: >-
    In our Angular app we call HydraSDK.initialize() in ngOnInit of AppComponent, awaiting it,
    and we guard every track call with isInitialized(). The SDK often doesn't start on app
    load. What's the correct pattern?
  expect:
    contains: ["sdkService.initialize()"]
    judge:
      - q: "Does the answer say to call initialize at module load / top level of the service file, not in ngOnInit or any lifecycle hook?"
        want: "yes"
      - q: "Does the answer say not to await SDK calls and not to add isInitialized() guards because the SDK queues calls until ready?"
        want: "yes"
  source: web/firebase.md › Steps › 6 (Rules to enforce) and Known Issues (SDK not initialising on app load)

- id: web-firebase-identify-actiontype-refresh
  profile: web/firebase
  category: identity
  question: >-
    We call identifyUser(type, cuid, "USER_UPDATE") whenever the app boots, for returning
    users, and new sign-ups seem to be missing in Capillary. What should login, sign-up and
    page refresh each do?
  expect:
    contains: ["USER_REGISTER", "IndexedDB"]
    judge:
      - q: "Does the answer say USER_REGISTER is for both login and sign-up, and USER_UPDATE only for profile changes, never at login?"
        want: "yes"
      - q: "Does the answer say not to re-identify on page refresh because the user context persists in IndexedDB?"
        want: "yes"
  source: web/firebase.md › Steps › 7 and Known Issues (Wrong actionType; Re-identifying on every refresh)

- id: web-firebase-reset-logout
  profile: web/firebase
  category: identity
  question: >-
    What do we call when the user signs out, and what state is the SDK in afterwards?
  expect:
    contains: ["reset"]
    judge:
      - q: "Does the answer say reset() returns tracking to anonymous and clears the Capillary token?"
        want: "yes"
  source: web/firebase.md › Steps › 7

- id: web-firebase-consent
  profile: web/firebase
  category: events
  question: >-
    Our cookie banner lets people opt out. After they revoke consent our analytics team says
    events are missing. Is the SDK broken, and how do we handle consent properly?
  expect:
    contains: ["enableTracking", "disableTracking"]
    judge:
      - q: "Does the answer say the missing events are expected because new events are dropped while tracking is disabled?"
        want: "yes"
      - q: "Does the answer say queued events stay in IndexedDB and are sent on re-enable, and that the app should persist the decision and restore it on load?"
        want: "yes"
  source: web/firebase.md › Steps › 7 and Known Issues (Events missing after consent revoked)

- id: web-firebase-correction-getuser
  profile: web/firebase
  category: correction
  question: >-
    Our teammate's runbook says to call HydraSDK.getUser() to read the anonymous visitor ID.
    What's the right call?
  expect:
    contains: ["getAnonymousId"]
    judge:
      - q: "Does the answer recommend HydraSDK.getUser()?"
        want: "no"
      - q: "Does the answer say getAnonymousId() returns the backend-assigned anonymous visitor ID (string or null) and works regardless of auth state?"
        want: "yes"
  source: web/firebase.md › Modules › Visitor (⚠️ Correction)

- id: web-firebase-correction-2024-runbook
  profile: web/firebase
  category: correction
  question: >-
    A colleague wants us to follow the 2024 Cursor runbook for the web SDK because it's more
    detailed than the current docs. Is that a good idea for push and the visitor ID?
  expect:
    contains: ["getAnonymousId", "messaging"]
    judge:
      - q: "Does the answer recommend following the 2024 Cursor runbook?"
        want: "no"
      - q: "Does the answer say to use the current AI-assisted runbook (summarised in this file), which uses notifications.messaging, a service-worker file and getAnonymousId()?"
        want: "yes"
  source: web/firebase.md › Prerequisites (⚠️ Correction)

- id: web-firebase-correction-browser-matrix
  profile: web/firebase
  category: correction
  question: >-
    Our PM found a table saying push works from Chrome 49, Firefox 52 and Safari 10, and
    Internet Explorer 11 in a limited way. What are the actual minimum browsers for push?
  expect:
    contains: ["109", "140", "26.3"]
    judge:
      - q: "Does the answer give Chrome 109+, Firefox 140+, Safari 26.3+ and Edge (Chromium) 149+ as the minimums for push?"
        want: "yes"
      - q: "Does the answer recommend Chrome 49 as the minimum for push?"
        want: "no"
      - q: "Does the answer say Internet Explorer is not supported?"
        want: "yes"
  source: web/firebase.md › Requirements (⚠️ Correction)

- id: web-firebase-correction-notifications-block
  profile: web/firebase
  category: correction
  question: >-
    Our push config is `notifications: { vapidKey: "...", serviceWorkerPath: "/firebase-messaging-sw.js" }`
    and push doesn't register. The 2024 runbook says that's all that's needed. What are we missing?
  expect:
    contains: ["getMessaging(firebaseApp)", "hydra-fcm"]
    judge:
      - q: "Does the answer say the notifications block needs a messaging property built with getMessaging on your own Firebase app?"
        want: "yes"
      - q: "Does the answer recommend a notifications block with only vapidKey and serviceWorkerPath?"
        want: "no"
  source: web/firebase.md › Modules › Push (P3, ⚠️ Correction)

- id: web-firebase-correction-sw-template
  profile: web/firebase
  category: correction
  question: >-
    The 2024 runbook says Capillary will send us a firebase-messaging-sw.js template. We've
    been waiting. Where do we get the service worker file?
  expect:
    contains: ["push-notification-web", "firebase-messaging-sw.js"]
    judge:
      - q: "Does the answer say to copy the published firebase-messaging-sw.js (from the push-notification-web docs) rather than wait for a template from Capillary?"
        want: "yes"
      - q: "Does the answer say to replace only the YOUR_* values in the Firebase config block and not rename the file or change its logic?"
        want: "yes"
  source: web/firebase.md › Modules › Push (P4, ⚠️ Correction)

- id: web-firebase-correction-gamification-baseurl
  profile: web/firebase
  category: correction
  question: >-
    Per the 2024 guide we put gamificationWriteKey and gamificationRegion in our Remote Config
    JSON and treated the base URL as optional. Gamification entry points never show. What do
    we do?
  expect:
    contains: ["gamificationBaseUrl"]
    judge:
      - q: "Does the answer say all three gamificationWriteKey, gamificationRegion and gamificationBaseUrl are required together in the Remote Config JSON?"
        want: "yes"
      - q: "Does the answer say to republish the Remote Config after adding the field?"
        want: "yes"
      - q: "Does the answer say gamificationBaseUrl is optional?"
        want: "no"
  source: web/firebase.md › Modules › Gamification (⚠️ Correction) and Known Issues (Gamification entry points not appearing)

- id: web-firebase-push-app-exists
  profile: web/firebase
  category: push
  question: >-
    After enabling push we get "FirebaseError: Firebase App named '[DEFAULT]' already exists
    (app/duplicate-app)". The SDK already uses our Firebase credentials for Remote Config.
    How do we fix it?
  expect:
    contains: ["hydra-fcm"]
    judge:
      - q: "Does the answer say to create the push Firebase app as a separately named app (second argument to initializeApp)?"
        want: "yes"
  source: web/firebase.md › Modules › Push (P3) and Known Issues ("Firebase App already exists")

- id: web-firebase-push-subpath-404
  profile: web/firebase
  category: push
  question: >-
    The app is hosted at https://example.com/my-app/ . DevTools shows firebase-messaging-sw.js
