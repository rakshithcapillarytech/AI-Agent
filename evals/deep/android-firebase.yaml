  source: android/firebase.md › Modules › Gamification (callback, Gap)

- id: android-firebase-wire-gamification-manager
  profile: android/firebase
  category: gamification
  question: >-
    Where exactly do we create GamificationUIManager, and where do we attach our GamificationCallback?
    We call getGamificationManager() but don't know in which class this belongs.
  expect:
    contains: ["GamificationUIManager", "getGamificationManager"]
    judge:
      - q: "Does the answer say to create it in the Application class right after SDK initialisation, and assign the callback at the same time?"
        want: "yes"
  source: android/firebase.md › Steps › 15

- id: android-firebase-screen-reporting-rn-trap
  profile: android/firebase
  category: trap
  question: >-
    Our Popup campaigns targeted at specific screens never show, and LeakCanary flags activities
    that were left behind. In React Native we call gamificationScreenAppeared. What's the native
    Android way, and how do we tell the SDK the app went to the background and foreground?
  expect:
    contains: ["onScreenChanged", "onActivityDestroyed", "ProcessLifecycleOwner"]
    judge:
      - q: "Does the answer recommend gamificationScreenAppeared as the call to use in this native Android app?"
        want: "no"
      - q: "Does the answer say onActivityDestroyed must be called to prevent memory leaks from attached entry-point views?"
        want: "yes"
  source: android/firebase.md › Steps › 16 and 17 and Known Issues

- id: android-firebase-late-remote-config
  profile: android/firebase
  category: edge-case
  question: >-
    Our Firebase Remote Config values for gamification arrive a few seconds after Hydra has
    already been initialised, so gamification never starts. How do we handle values that come late?
  expect:
    contains: ["updateRemoteConfig"]
    judge:
      - q: "Does the answer say to wire GamificationUIManager afterwards if it hasn't been created yet?"
        want: "yes"
      - q: "Does the answer say updateRemoteConfig returns a Boolean indicating success?"
        want: "yes"
  source: android/firebase.md › Steps › 18 and Known Issues

- id: android-firebase-loyalty-token-order
  profile: android/firebase
  category: edge-case
  question: >-
    Our LoyaltyEmbedView renders empty. We fetch the B2B token after the screen's onResume has
    already reported the screen, then call setCapToken. Also, how do we obtain that token and
    the embedId in the first place?
  expect:
    contains: ["setCapToken"]
    judge:
      - q: "Does the answer say the token must be set before the Loyalty View renders (before the screen is reported)?"
        want: "yes"
      - q: "Does the answer state a specific way to obtain the Capillary B2B token or the embedId as documented fact?"
        want: "no"
  source: android/firebase.md › Steps › 19 and Modules › Gamification (Gap); _shared/prerequisites.md

- id: android-firebase-embed-bind-trap
  profile: android/firebase
  category: trap
  question: >-
    A developer from our no-Firebase app says each EmbedWebView needs an explicit
    bindEmbedView(...) call. Do we need that here, and how do the Banner, Embedded and Loyalty
    views get rendered in this setup?
  expect:
    contains: ["EmbedWebView", "onScreenChanged"]
    judge:
      - q: "Does the answer tell the client to call bindEmbedView in this (Firebase) mode?"
        want: "no"
      - q: "Does the answer say all three views are bound and rendered automatically by GamificationUIManager once the screen is reported?"
        want: "yes"
  source: android/firebase.md › Modules › Gamification

- id: android-firebase-core-remote-config-keys-gap
  profile: android/firebase
  category: gap
  question: >-
    We want to rotate our SSL public key without shipping a new release, so we'll put it, plus the
    account id and base URL, in Remote Config. Flutter uses hydra_account_id, hydra_base_url and
    hydra_ssl_public_key. Are those the Remote Config key names for native Android too?
  expect:
    contains: ["9 months"]
    judge:
      - q: "Does the answer confirm the Flutter key names (hydra_account_id, hydra_base_url, hydra_ssl_public_key) as the documented Android Remote Config keys for the core values?"
        want: "no"
      - q: "Does the answer say the Android Remote Config key names for the core values aren't documented / suggest asking a Capillary engineer?"
        want: "yes"
      - q: "Does the answer say the SSL public key expires about every 9 months and shouldn't be hard-coded?"
        want: "yes"
  source: android/firebase.md › Coverage (Gap); _shared/prerequisites.md › SSL public key; _shared/firebase-setup.md › Core keys

- id: android-firebase-client-credentials-failed
  profile: android/firebase
  category: prerequisites
  question: >-
    On a dev flavor (applicationId ends in .dev) the SDK log prints `Client Credentials Generation
    Failed` with `{"error":"source not found","status":400}`. Which things must match what
    Capillary registered, and what do we have to send them for registration?
  expect:
    contains: ["App Signature", "Bundle Name"]
    judge:
      - q: "Does the answer say a build variant with a different application ID is a different app to Capillary and must be registered?"
        want: "yes"
      - q: "Does the answer say to compare the build's SHA256 signature with the registered App Signature and ask Capillary to update it?"
        want: "yes"
  source: android/firebase.md › Known Issues; _shared/troubleshooting.md › 1 and 2; _shared/push.md

- id: android-firebase-push-never-arrives-skipped-reason
  profile: android/firebase
  category: troubleshooting
  question: >-
    Sign-in works and we see a token in the logs, but campaign pushes never arrive. Capillary's
    campaign report shows `Request Entity Not Found` for our test user and `Profile Not Found`
    for another. What do these mean and how do we narrow down whether it's our app or Capillary?
  expect:
    contains: ["FCM Project ID", "Firebase console"]
    judge:
      - q: "Does the answer say Request Entity Not Found means the FCM token expired and the user should log out and log in again?"
        want: "yes"
      - q: "Does the answer say to send a test message from the Firebase console to the same token to separate app/Firebase problems from Capillary registration problems?"
        want: "yes"
      - q: "Does the answer say the Firebase project in the app must match the FCM Project ID registered at Capillary?"
        want: "yes"
  source: android/firebase.md › Known Issues; _shared/push.md › Why Capillary skipped a message, Test the push flow
