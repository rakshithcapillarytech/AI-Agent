    evidence: ["HydraCore.isSdkInitialized()", "These reject before initialisation"]
  "G1":
    do: "Gamification only: nothing to install, since Gamification is part of the package from step 2. The minimum package version for Gamification is not stated in the public docs, so confirm it with Capillary."
    evidence: ["Gamification is part of the package from step 2.", "the public docs state no minimum"]
  "G2":
    do: "Gamification only: in Firebase Remote Config add `hydra_gamification_key`, `hydra_gamification_region` and `hydra_gamification_base_url` with values from Capillary; all three are required. With custom key names, pass them in the `keyForGamification` arguments."
    evidence: ["hydra_gamification_region", "Gamification requires all three"]
  "G3":
    do: "Only for gamification campaigns: after sign-in, call `Hydra.gamificationScreenAppeared(screenName)` when a screen shows and `Hydra.gamificationScreenDisappeared(screenName)` with the same name when it goes. Ask Capillary which screen names campaigns target."
    evidence: ["Hydra.gamificationScreenAppeared(screenName)", "with the **same** name", "which `screenName` values campaigns target isn't documented"]
  "G4":
