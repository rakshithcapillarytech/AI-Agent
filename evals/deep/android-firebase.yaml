# Deep evaluation questions for android/firebase (Hydra SDK with Firebase: FCM push, Remote Config gamification keys).
# Format: see evals/golden.yaml. Every `contains` string is present in the kit for this profile.

- id: android-firebase-version-catalog-androidx
  profile: android/firebase
  category: gap
  question: >-
    We're on Gradle 7.2 and want the recommended install path with the Hydra version catalog.
    What goes into settings.gradle, and which versions should we put for the androidx libraries
    that the sample shows as xxx?
  expect:
    contains: ["enableFeaturePreview", "hydra-catalog"]
    judge:
      - q: "Does the answer state specific version numbers for androidx.core, appcompat or lifecycle-process as the ones to use?"
        want: "no"
      - q: "Does the answer say the androidx versions aren't documented / suggest asking a Capillary engineer?"
        want: "yes"
  source: android/firebase.md › Steps › 2 and 3 (AndroidX Gap)

- id: android-firebase-deps-and-min-version
  profile: android/firebase
  category: correction
  question: >-
    Give us the exact Gradle lines for core plus push without the version catalog. We also want
    gamification. Our integration PDF mentions 1.9.22-beta01 as the gamification minimum, so
    that's the version we'll use, right?
  expect:
    contains: ["hydra-pushbase", "hydra-firebase", "1.9.22-beta02"]
    judge:
      - q: "Does the answer recommend 1.9.22-beta01 as the SDK version to use?"
        want: "no"
      - q: "Does the answer say gamification needs no extra dependency because it is bundled within HydraCore?"
        want: "yes"
  source: android/firebase.md › Requirements (Correction) and Steps › 3

- id: android-firebase-maven-401
  profile: android/firebase
  category: known-issue
  question: >-
    Gradle sync fails: `Received status code 401 from server: Unauthorized` for
    maven.pkg.github.com/Capillary/hydra-sdk-android-maven. Our github.properties sits in the app/
    module folder. What do we check?
  expect:
    contains: ["read:packages", "settings.gradle"]
    judge:
      - q: "Does the answer say github.properties belongs at the project root next to settings.gradle?"
        want: "yes"
  source: android/firebase.md › Known Issues (Gradle can't resolve hydra-core)

- id: android-firebase-init-account-id-exception
  profile: android/firebase
  category: known-issue
  question: >-
    Our app crashes inside MyApplication.onCreate as soon as Hydra initialises. We set baseURL and
    sslPublicKey on HydraConfig.Builder and nothing else. What did we forget?
  expect:
    contains: ["accountId"]
    judge:
      - q: "Does the answer say the SDK throws an exception when accountId isn't provided?"
        want: "yes"
  source: android/firebase.md › Steps › 5 and Known Issues

- id: android-firebase-init-vs-initialize-gap
  profile: android/firebase
  category: gap
  question: >-
    With gamification enabled, should we call `HydraAPI.initialize(applicationContext, hydraConfig)`
    as the gamification page does, or `HydraAPI.instanceWithConfig(...)` as the init page does?
    Which one is the right one?
  expect:
    contains: ["instanceWithConfig"]
    judge:
      - q: "Does the answer state definitively that only one of the two calls is correct when gamification is enabled?"
        want: "no"
      - q: "Does the answer say the docs use both and suggest asking a Capillary engineer?"
        want: "yes"
  source: android/firebase.md › Steps › 14 (Gap)

- id: android-firebase-init-options-manifest
  profile: android/firebase
  category: init
  question: >-
    We want verbose SDK logs locally, remote debug logs, ViewPort capture, and to make sure Android
    actually instantiates our MyApplication class. Show us the HydraConfig.Builder options and the
    manifest part.
  expect:
    contains: [".debugLevel", ".remoteDebugLevel", "android:name"]
    judge:
      - q: "Does the answer say the SDK instance is created once, in Application.onCreate()?"
        want: "yes"
  source: android/firebase.md › Steps › 5 and 6

- id: android-firebase-signin-cuid
  profile: android/firebase
  category: identity
  question: >-
    A user logs in with only a phone number, no name or email. How do we call the sign-in API?
    Our backend primary key is a UUID, but Capillary CRM matches customers on email.
  expect:
    contains: ["pushUserSignin", "emptyMap()"]
    judge:
      - q: "Does the answer say the cuid / customer identifier must match the Account Linking Identifier configured in Capillary CRM (not an arbitrary internal id)?"
        want: "yes"
  source: android/firebase.md › Steps › 7

- id: android-firebase-signout-preferences
  profile: android/firebase
  category: identity
  question: >-
    On logout we want to clear the previously logged user, and we also need to record that this
    user opted out of promotional push but still wants transactional push. What do we call?
  expect:
    contains: ["pushUserSignOut", "passUserPreferences"]
    judge:
      - q: "Does the answer use UserPreferences with promPushOpted / transPushOpted (or promOpted / transOpted) for the opt-in flags?"
        want: "yes"
  source: android/firebase.md › Steps › 7 and API Reference

- id: android-firebase-events-before-signin
  profile: android/firebase
  category: edge-case
  question: >-
    We call `hydraAPI?.pushEvent("button Click", mapOf("Username" to "Henry"))` right after app
    launch for a logged-out user and the event never appears in Capillary. What's going on?
  expect:
    contains: ["pushEvent"]
    judge:
      - q: "Does the answer say events are valid only after a sign-in or sign-up (and invalid after sign-out)?"
        want: "yes"
      - q: "Does the answer say the behavioural event must be created in Capillary first?"
        want: "yes"
  source: android/firebase.md › Steps › 8 and Known Issues

- id: android-firebase-permission-and-drawer
  profile: android/firebase
  category: known-issue
  question: >-
    Two push complaints from QA. A Pixel on Android 14 gets no notifications at all after a fresh
    install, and on other devices only the newest notification stays in the drawer. We also
    want a custom small icon. What do we change?
  expect:
    contains: ["requestPushPermission", "isMultipleNotificationInDrawerEnabled"]
    judge:
      - q: "Does the answer say notifications are disabled by default from Android 13 so the app must request the permission?"
        want: "yes"
      - q: "Does the answer mention NotificationConfig with smallIcon?"
        want: "yes"
  source: android/firebase.md › Steps › 9, 11 and Known Issues

- id: android-firebase-own-messaging-service
  profile: android/firebase
  category: known-issue
  question: >-
    We already have our own FirebaseMessagingService for chat. Since adding Hydra, its pushes get
    mishandled, and some of our chat payloads end up in Hydra's handling. How should we wire it?
  expect:
    contains: ["FcmConfig(false)", "isFromHydraPlatform", "passPushPayload"]
    judge:
      - q: "Does the answer say to opt out of SDK token registration with FcmConfig(false) and pass tokens (passPushToken) and Hydra payloads from the app's own service?"
        want: "yes"
  source: android/firebase.md › Steps › 10 B and Known Issues

- id: android-firebase-token-refresh-passfcmtoken-trap
  profile: android/firebase
  category: trap
  question: >-
    Users who reinstall or restore to a new phone stop receiving pushes. We own our messaging
    service. In our React Native app we solved this with passFCMToken. What's the native Android
    equivalent here?
  expect:
    contains: ["passPushToken", "onNewToken"]
    judge:
      - q: "Does the answer recommend passFCMToken as the call to use in this native Android app?"
        want: "no"
      - q: "Does the answer say to pass every new token (whenever it changes: new device, reinstall, cleared data) to the SDK?"
        want: "yes"
  source: android/firebase.md › Steps › 10 B and Known Issues; _shared/push.md

- id: android-firebase-sdk-handles-push
  profile: android/firebase
  category: push
  question: >-
    We want Hydra to register the FCM token by itself. What config and manifest entry do we need,
    and how can we get notified when a token is registered or refreshed?
  expect:
    contains: ["FcmConfig(true)", "HydraFirebaseMessagingService", "addTokenListener"]
    judge:
      - q: "Does the answer mention TokenAvailableListener with onTokenAvailable?"
        want: "yes"
  source: android/firebase.md › Steps › 10 A and 12

- id: android-firebase-listener-callbacks-click
  profile: android/firebase
  category: known-issue
  question: >-
    Push callbacks (shown, clicked, dismissed) aren't delivered while the app is in the background.
    Separately, we return false from onNotificationClick because we want to handle the tap
    ourselves, but the SDK opens the CTA anyway. What are we doing wrong?
  expect:
    contains: ["registerPushNotificationListener"]
    judge:
      - q: "Does the answer say to return true from onNotificationClick when the app handles the click itself?"
        want: "yes"
      - q: "Does the answer say the listener must be registered in Application.onCreate after HydraAPI is initialised?"
        want: "yes"
  source: android/firebase.md › Steps › 12 and Known Issues

- id: android-firebase-cta-deeplink-launcher
  profile: android/firebase
  category: known-issue
  question: >-
    Tapping our push opens the app's home screen instead of the offer page. The campaign deep
    link is `cap://offers/summer`, and a custom-scheme link doesn't open our target activity at
    all. What's missing?
  expect:
    contains: ["intent-filter", "launcher"]
    judge:
      - q: "Does the answer say the launcher activity opens when no primary CTA URI / deep link is configured on the campaign?"
        want: "yes"
  source: android/firebase.md › Steps › 13 and Known Issues

- id: android-firebase-late-push-ttl
  profile: android/firebase
  category: edge-case
  question: >-
    A tester received a push for a campaign that ended three days ago, and only when they opened
    the app. Is that a bug in our integration?
  expect:
    contains: ["15 days"]
    judge:
      - q: "Does the answer say this is expected behaviour (the SDK pulls the push on app open within the campaign TTL)?"
        want: "yes"
      - q: "Does the answer say the TTL is configurable per organisation?"
        want: "yes"
  source: android/firebase.md › Modules › Push and Known Issues

- id: android-firebase-rich-push-ios-trap
  profile: android/firebase
  category: trap
  question: >-
    We want carousel rich push on Android. What dependencies do we need? Also, like on iOS, do we
    need a Notification Service Extension and an App Group shared with it?
  expect:
    contains: ["hydra-richnotification", "AlarmPermissionUtils"]
    judge:
      - q: "Does the answer say a Notification Service Extension or an App Group is required for Android rich push?"
        want: "no"
      - q: "Does the answer mention checking and requesting the exact-alarm permission on Android 12+ for carousel timing?"
        want: "yes"
  source: android/firebase.md › Steps › 13

- id: android-firebase-inapp-never-shows-config-gap
  profile: android/firebase
  category: gap
  question: >-
    In-app messages never show, though we added hydra-inapp and registered a click listener. Also,
    how exactly do we hand our InAppConfig fallback image to HydraConfig.Builder?
  expect:
    judge:
      - q: "Does the answer say the push module must already be integrated because in-app messages are delivered through Hydra's push mechanism?"
        want: "yes"
      - q: "Does the answer state a specific HydraConfig.Builder method for passing InAppConfig as documented fact?"
