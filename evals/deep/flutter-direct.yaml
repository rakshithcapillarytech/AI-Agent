# Deep question bank: Flutter, direct mode (values passed in the native initializer).
# Every `contains` string is verified against the kit (flutter/direct.md + _shared/*.md).

- id: flutter-direct-install-package-source
  profile: flutter/direct
  category: correction
  question: >-
    We're adding the Hydra SDK to our Flutter app. The only guide our team has is a PDF
    from 2024 that pins a specific beta build, and someone also found a GitHub repository
    for the Flutter lib. What do we actually put in the project to install it, and do we
    need any credentials?
  expect:
    contains: ["flutter pub add capillary_hydra capillary_hydra_platform_interface", "pub.dev"]
    judge:
      - q: "Does the answer recommend pinning the 2024 guide's beta version (1.1.1-beta.6)?"
        want: "no"
      - q: "Does the answer recommend installing from the GitHub repository flutter-hydra-lib?"
        want: "no"
      - q: "Does the answer say the two packages should be kept on the same version?"
        want: "yes"
  source: flutter/direct.md › Requirements, Steps › 2 (Corrections)

- id: flutter-direct-config-json-pinning-init
  profile: flutter/direct
  category: setup
  question: >-
    Fresh Flutter project, packages already added. Where do we create the Hydra config
    JSON, how do we switch off SSL certificate pinning for a debug build, how do we make
    the icon images under capillary/icons get bundled, and where in Dart do we start the SDK?
  expect:
    contains: ["capillary/hydra-config.json", "enable_ssl_pinning", "HydraInitializer.initialize"]
    judge:
      - q: "Does the answer say to call HydraInitializer.initialize() in main() before runApp?"
        want: "yes"
      - q: "Does the answer say enable_ssl_pinning set to false turns pinning off (and that it defaults to true)?"
        want: "yes"
      - q: "Does the answer say to list capillary/ and capillary/icons/ under flutter assets in pubspec.yaml?"
        want: "yes"
  source: flutter/direct.md › Steps › 3, 4, 6

