# Deep question bank: Flutter, Firebase mode (settings read from Firebase Remote Config).
# Every `contains` string is verified against the kit (flutter/firebase.md + _shared/*.md).

- id: flutter-firebase-install-package-source
  profile: flutter/firebase
  category: correction
  question: >-
    We're adding the Hydra SDK to our Flutter app. The only guide our team has is a PDF
    from 2024 that pins a specific beta build, and someone also found a GitHub repository
    for the Flutter lib. What do we actually put in the project to install it?
  expect:
    contains: ["flutter pub add capillary_hydra capillary_hydra_platform_interface", "pub.dev"]
    judge:
      - q: "Does the answer recommend pinning the 2024 guide's beta version (1.1.1-beta.6)?"
        want: "no"
      - q: "Does the answer recommend installing from the GitHub repository flutter-hydra-lib?"
        want: "no"
      - q: "Does the answer say the two packages should be kept on the same version?"
        want: "yes"
  source: flutter/firebase.md › Requirements, Steps › 2 (Corrections)

- id: flutter-firebase-remote-config-keys-and-json
  profile: flutter/firebase
  category: setup
  question: >-
    We just got our account values from Capillary. Which parameters do we publish in Firebase
    Remote Config for a basic integration with visitor flow, what is the remote log level
    parameter, and which JSON file do we create in the project for the other SDK switches
