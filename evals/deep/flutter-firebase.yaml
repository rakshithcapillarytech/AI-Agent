        want: "yes"
      - q: "Does the answer say the parameter names must be exactly as documented?"
        want: "yes"
      - q: "Does the answer mention capillary/hydra-config.json with enable_ssl_pinning set to false to turn pinning off?"
        want: "yes"
  source: flutter/firebase.md › Steps › 1, 3

